[package]
name = "reetched-script"
description = "Python scripting for ReEtched: finds the user's CPython and drives the reetched-python bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
# Python is loaded at runtime, never linked: the app must start without it.
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
