[package]
name = "reetched-library"
description = "Asset library: scanned, tagged, searchable and watched folders of materials, brushes and textures"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
blake3 = "1"
# Raster fallback when the app's decoder declines, plus HDR/EXR for environment previews.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "tiff", "bmp", "webp", "hdr", "exr"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
