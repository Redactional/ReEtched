[package]
name = "reetched-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "reetched"
path = "src/main.rs"

[dependencies]
reetched-io.workspace = true
anyhow.workspace = true
glam.workspace = true
log.workspace = true
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
egui_tiles = "0.18"
egui_material_icons = "0.9"
reetched-doc.workspace = true
serde_json = "1"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
half = { version = "2", features = ["bytemuck"] }
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["hdr", "exr", "png", "jpeg", "tga", "tiff"] }
rfd = "0.17"
