[package]
name = "reetched-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "reetched"
path = "src/main.rs"

# App bundles (`cargo bundle --release -p reetched-app`): a .app with the .icns
# on macOS, a .deb with the PNG icons on Linux.
[package.metadata.bundle]
name = "ReEtched"
identifier = "io.github.redactional.reetched"
icon = [
    "../../assets/icons/ReEtched.icns",
    "../../assets/icons/linux/ReEtched_*.png",
]
category = "public.app-category.graphics-design"
short_description = "Open-source 3D texture painter"

[dependencies]
reetched-io.workspace = true
anyhow.workspace = true
glam.workspace = true
log.workspace = true
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
egui_tiles = "0.18"
egui_material_icons = "0.9"
reetched-doc.workspace = true
reetched-bake.workspace = true
reetched-graph.workspace = true
reetched-substance.workspace = true
reetched-color.workspace = true
reetched-shader.workspace = true
reetched-trace.workspace = true
reetched-library = { path = "../reetched-library" }
reetched-spp.workspace = true
reetched-script = { path = "../reetched-script" }
naga = "30.0.1"
serde_json = "1"
wgpu = { version = "30", features = ["naga-ir"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
half = { version = "2", features = ["bytemuck"] }
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["hdr", "exr", "png", "jpeg", "tga", "tiff"] }
rfd = "0.17"
resvg = "0.48"
dirs = "6"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
rayon = "1.12"

[dev-dependencies]
psd = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
