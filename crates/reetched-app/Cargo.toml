[package]
name = "reetched-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "reetched"
path = "src/main.rs"

# Installers (`cargo packager --release`, see README): NSIS on Windows, .app/.dmg
# on macOS, .deb/AppImage on Linux. Put the reetched_python library in
# target/release/bridge/ first; it ships next to the executable.
[package.metadata.packager]
product-name = "ReEtched"
identifier = "io.github.redactional.reetched"
description = "Open-source 3D texture painter"
category = "GraphicsAndDesign"
icons = [
    "../../assets/icons/ReEtched.ico",
    "../../assets/icons/ReEtched.icns",
    "../../assets/icons/linux/ReEtched_*.png",
]
resources = [{ src = "../../target/release/bridge/*", target = "." }]
before-packaging-command = "cargo build --release -p reetched-app -p reetched-python"

[dependencies]
reetched-io.workspace = true
anyhow.workspace = true
glam.workspace = true
log.workspace = true
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
egui_tiles = "0.18"
egui_material_icons = "0.9"
reetched-doc.workspace = true
reetched-bake.workspace = true
reetched-graph.workspace = true
reetched-substance.workspace = true
reetched-color.workspace = true
reetched-shader.workspace = true
reetched-trace.workspace = true
reetched-library = { path = "../reetched-library" }
reetched-spp.workspace = true
reetched-script = { path = "../reetched-script" }
naga = "30.0.1"
serde_json = "1"
wgpu = { version = "30", features = ["naga-ir"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
half = { version = "2", features = ["bytemuck"] }
env_logger = "0.11"
# Local-time log timestamps (already used by env_logger, which stamps UTC).
jiff = "0.2"
image = { version = "0.25", default-features = false, features = ["hdr", "exr", "png", "jpeg", "tga", "tiff"] }
rfd = "0.17"
resvg = "0.48"
dirs = "7"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
rayon = "1.12"

[target.'cfg(windows)'.dependencies]
# Already in the tree through winit; the developer console (console.rs).
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
psd = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
