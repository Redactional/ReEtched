# Builds ReEtched for Windows, macOS and Linux and publishes a GitHub release.
# Runs when a version tag (v1.2.3) is pushed, or by hand for an existing tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.2.0)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            formats: nsis
            platform: windows-x64
          - os: macos-latest
            formats: app,dmg
            platform: macos-arm64
          - os: ubuntu-latest
            formats: deb,appimage
            platform: linux-x64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "reetched-app") | .version')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG doesn't match the version in Cargo.toml ($version). Update [workspace.package] version first."
            exit 1
          fi

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build
        run: cargo build --release -p reetched-app -p reetched-python

      - name: Stage the Python bridge
        shell: bash
        run: |
          mkdir -p target/release/bridge
          for f in target/release/reetched_python.dll target/release/libreetched_python.dylib target/release/libreetched_python.so; do
            if [ -f "$f" ]; then cp "$f" target/release/bridge/; fi
          done

      - name: Installers
        run: cargo packager --release -p reetched-app --formats ${{ matrix.formats }} --binaries-dir target/release --out-dir dist

      # The portable copy ReLauncher installs: ReEtched-<version>-<platform>.zip
      - name: Portable archive
        shell: bash
        run: |
          name="ReEtched-${TAG#v}-${{ matrix.platform }}.zip"
          rm -rf portable && mkdir -p portable
          case "${{ matrix.platform }}" in
            windows-*)
              cp target/release/reetched.exe target/release/bridge/* portable/
              (cd portable && 7z a "../dist/$name" *) ;;
            macos-*)
              app=$(find dist -maxdepth 2 -name "*.app" | head -1)
              ditto -c -k --keepParent "$app" "dist/$name" ;;
            linux-*)
              cp target/release/reetched target/release/bridge/* portable/
              (cd portable && zip -r "../dist/$name" .) ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.zip

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ReEtched ${{ env.TAG }}
          generate_release_notes: true
          # v1.2.3-beta.1 and similar are pre-releases (ReLauncher skips them).
          prerelease: ${{ contains(env.TAG, '-') }}
          fail_on_unmatched_files: true
          files: dist/*
