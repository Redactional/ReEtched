[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Redactional/ReEtched"
rust-version = "1.88"

[workspace.dependencies]
reetched-io = { path = "crates/reetched-io" }
anyhow = "1"
glam = { version = "0.34", features = ["bytemuck"] }
log = "0.4"

[profile.dev.package."*"]
# Dependencies (image decoding, ufbx, mikktspace) are painfully slow unoptimized.
opt-level = 2
